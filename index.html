<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DoSJE AI-Smart Monitor & Vigilance Portal | Government of India</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%231e3a8a'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>" />
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gov: {
              navy: '#0A1E3F',
              blue: '#1E3A8A',
              azure: '#2563EB',
              sky: '#38BDF8',
              gold: '#D97706',
              saffron: '#EA580C',
              green: '#15803D',
              emerald: '#059669',
              light: '#F8FAFC',
              border: '#E2E8F0',
              textMuted: '#64748B'
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
          },
          boxShadow: {
            gov: '0 4px 20px -2px rgba(10, 30, 63, 0.08), 0 2px 6px -1px rgba(10, 30, 63, 0.04)',
            'gov-lg': '0 10px 30px -4px rgba(10, 30, 63, 0.12), 0 4px 10px -2px rgba(10, 30, 63, 0.06)',
          }
        }
      }
    }
  </script>

  <!-- Leaflet Map CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- React 18 & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel Standalone to compile JSX in browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: #f1f5f9;
      color: #0f172a;
    }
    .tricolor-strip {
      background: linear-gradient(to right, #FF9933 33.33%, #FFFFFF 33.33%, #FFFFFF 66.66%, #138808 66.66%);
      height: 3px;
    }
    @keyframes live-pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.15); }
    }
    .animate-live-pulse {
      animation: live-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    .leaflet-container {
      font-family: inherit;
      z-index: 10 !important;
    }
    .leaflet-popup-content-wrapper {
      border-radius: 12px;
      padding: 0;
      overflow: hidden;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.15);
    }
    .leaflet-popup-content {
      margin: 0 !important;
      line-height: 1.4;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
  </style>
</head>
<body class="antialiased min-h-screen selection:bg-blue-600 selection:text-white">
  <div id="root"></div>

  <!-- Lucide Icons script shim -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- React Application Source -->
  <script type="text/babel" src="./app.jsx"></script>
</body>
</html>
